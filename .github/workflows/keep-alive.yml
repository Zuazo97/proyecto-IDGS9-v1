# Render (plan free) duerme el servicio tras 15 min sin tráfico y tarda ~50 s en despertar.
# Este workflow hace ping a /api/health cada 10 min de 7:00 a 22:59 (hora del centro de México, UTC-6).
# Configura la URL en: Settings → Secrets and variables → Actions → Variables → API_URL
#   ej. https://proyecto-idgs9-v1.onrender.com
name: keep-alive

on:
  schedule:
    - cron: '*/10 13-23,0-4 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.API_URL }}/api/health"
